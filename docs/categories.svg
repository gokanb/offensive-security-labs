    <text x="102" y="160" text-anchor="middle" fill="#8b949e" font-size="11">crypt brute force</text>
  </g>
  <g>
    <rect x="190" y="70" width="156" height="110" rx="10" fill="#161b22" stroke="#db6d28" stroke-width="1.5"/>
