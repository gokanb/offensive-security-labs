<svg xmlns="http://www.w3.org/2000/svg" width="860" height="250" viewBox="0 0 860 250" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="860" height="250" rx="14" fill="#0d1117"/>
  <text x="430" y="38" text-anchor="middle" fill="#e6edf3" font-size="20" font-weight="700">offensive-security-labs — categories</text>

  <g>
