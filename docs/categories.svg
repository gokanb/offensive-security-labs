    <text x="268" y="144" text-anchor="middle" fill="#8b949e" font-size="11">pexpect, ftplib,</text>
    <text x="268" y="160" text-anchor="middle" fill="#8b949e" font-size="11">anonymous login</text>
  </g>
  <g>
    <rect x="356" y="70" width="156" height="110" rx="10" fill="#161b22" stroke="#bc8cff" stroke-width="1.5"/>
